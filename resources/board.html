<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="kb-csrf" content="__CSRF_TOKEN__" />
  <title>Kanban Board</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/assets/board.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/assets/logo.svg" alt="Kanban Board" width="26" height="26" class="brand-logo" />
      <span class="brand-title">Kanban Board</span>
      <span class="board-path" id="board-dir" title="Centralized board path">board/</span>
    </div>

    <div class="controls">
      <input type="search" id="f-q" class="search-input" placeholder="Search ref, title, agent (/)" autocomplete="off" />
      <select id="f-epic" class="select-input" aria-label="Filter by epic">
        <option value="">All epics</option>
      </select>
      <label class="toggle-chip" title="Group board into horizontal project swimlanes">
        <input type="checkbox" id="f-swimlanes" />
        <span>Swimlanes</span>
      </label>
      <label class="toggle-chip" title="Show retired backlog tickets (auto-purged after 120d)">
        <input type="checkbox" id="f-showretired" />
        <span>Retired</span>
      </label>
      <label class="toggle-chip" title="Hide Done column">
        <input type="checkbox" id="f-hidedone" />
        <span>Hide Done</span>
      </label>
    </div>

    <div class="status-cluster">
      <div class="leases-wrap">
        <button type="button" id="btn-leases" class="pill-btn" aria-expanded="false">
          <span class="dot dot-active"></span>
          <span id="leases-summary">0 active</span>
        </button>
        <div id="leases-popover" class="popover hidden" role="dialog" aria-label="Agent Leases">
          <div class="popover-head">
            <span>Agent Leases</span>
            <span id="leases-popover-count" class="muted"></span>
          </div>
          <div id="leases-list" class="leases-list"></div>
        </div>
      </div>

      <span id="f-count" class="count-badge">0 / 0</span>
      <span id="conn-pill" class="live-pill" title="Live SSE connection">
        <span class="dot dot-live"></span> live
      </span>
      <button type="button" id="btn-refresh" class="icon-btn" title="Refresh (r)" aria-label="Refresh">↻</button>
      <button type="button" id="btn-theme" class="icon-btn" title="Toggle theme (t)" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <div class="quickbar" aria-label="Project quick filters">
    <span class="quickbar-label">Projects</span>
    <div id="project-pills" class="project-pills"></div>
  </div>

  <main class="workspace">
    <div id="board-canvas" class="board-canvas" aria-live="polite"></div>

    <aside id="drawer" class="drawer hidden" aria-label="Ticket Details">
      <div class="drawer-head">
        <div class="drawer-meta">
          <div id="d-breadcrumb" class="breadcrumb"></div>
          <div class="drawer-title-row">
            <span id="d-ref" class="ref-chip"></span>
            <span id="d-status" class="status-pill"></span>
            <span id="d-rejected-pill" class="rejected-pill hidden">QA Rejected</span>
          </div>
          <h2 id="d-title" class="drawer-title"></h2>
        </div>
        <div class="drawer-actions">
          <button type="button" id="btn-drawer-approve" class="btn-review hidden">Approve →</button>
          <button type="button" id="btn-drawer-retire" class="btn-ghost hidden">Retire</button>
          <button type="button" id="btn-copy-ref" class="btn-ghost">Copy Ref</button>
          <button type="button" id="btn-close-drawer" class="icon-btn" aria-label="Close drawer">✕</button>
        </div>
      </div>

      <div id="d-meta-grid" class="meta-grid"></div>

      <nav class="drawer-tabs" role="tablist">
        <button type="button" class="tab-btn active" data-tab="overview" role="tab">Overview</button>
        <button type="button" class="tab-btn" data-tab="activity" role="tab">Activity &amp; QA <span id="d-audit-count" class="tab-count">0</span></button>
        <button type="button" class="tab-btn" data-tab="docs" role="tab">Docs</button>
      </nav>

      <div class="drawer-body">
        <section id="tab-overview" class="tab-panel active"></section>
        <section id="tab-activity" class="tab-panel hidden"></section>
        <section id="tab-docs" class="tab-panel hidden"></section>
      </div>
    </aside>
  </main>

  <div id="approve-modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="approve-modal-title">
    <div class="modal">
      <div class="modal-head">
        <h3 id="approve-modal-title">Human Approval to DONE</h3>
        <button type="button" id="btn-close-modal" class="icon-btn" aria-label="Close modal">✕</button>
      </div>
      <p class="modal-note">Approving <code id="m-ref"></code> triggers a native Windows confirmation popup to verify a human authorized this move.</p>
      <form id="approve-form">
        <label class="field">
          <span>Approver name</span>
          <input type="text" id="m-approver" value="Boss" required minlength="2" placeholder="Boss" />
        </label>
        <label class="field">
          <span>Approval reason (min 10 chars)</span>
          <textarea id="m-reason" rows="3" required minlength="10" placeholder="Verified output locally and tests pass..."></textarea>
        </label>
        <div id="m-error" class="form-error hidden"></div>

        <div class="slide-approve-box">
          <div class="slide-approve-label">
            <span id="slide-label-text">Slide right to approve →</span>
            <span id="slide-pct" class="muted">0%</span>
          </div>
          <input type="range" id="slide-approve" class="slide-approve-range" min="0" max="100" value="0" aria-label="Slide to approve ticket to DONE" />
        </div>

        <div class="modal-actions">
          <button type="button" id="btn-cancel-approve" class="btn-ghost">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div id="kb-toast" class="kb-toast hidden" role="status" aria-live="polite"></div>

  <script src="/assets/board.js" defer></script>
</body>
</html>
